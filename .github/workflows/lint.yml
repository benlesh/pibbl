name: Lint 🧹

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ESLint 🧹
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout 📦
        uses: actions/checkout@v4

      - name: Setup PNPM 📦
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node.js 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install Dependencies 🔧
        run: pnpm install --frozen-lockfile

      - name: Lint 🧹
        run: pnpm lint 
