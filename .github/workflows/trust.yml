name: Trust Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      check_npm_auth:
        description: Check npm trusted publishing without building or publishing packages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  contracts:
    if: github.event_name != 'workflow_dispatch' || inputs.check_npm_auth != true
    name: Trust / ${{ matrix.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Checked against the local aggregate by tooling/trust-workflow.test.mjs.
        stage: [static, package, browser, lifecycle, native]
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      # Include failed request URLs and Chromium error codes in browser failures.
      VITEST_PW_DEBUG: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js and pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@24.19.0
          cache: true
          install: false
      - name: Install Corepack used by repository scripts
        run: npm install --global corepack@0.35.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Verify local and CI gate coverage
        run: node --test tooling/trust-workflow.test.mjs
      - name: Cache pinned native inputs
        uses: actions/cache@v5
        with:
          path: |
            packages/text/.cache/*.tar.gz
            packages/text/.cache/emsdk-*
            packages/text/.cache/harfbuzz-*
            packages/text/.cache/sdk-archives
            packages/text/.cache/native
          key: text-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/text/native/**', 'packages/text/scripts/**') }}
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run canonical trust stage
        run: pnpm run trust:${{ matrix.stage }}
      - name: Upload available failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trust-${{ matrix.stage }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            **/.vitest-attachments/**
            **/test-screenshots/**
          retention-days: 14
          # Startup failures have no screenshots; preserve the original failure.
          if-no-files-found: ignore
          compression-level: 9
          include-hidden-files: true

  trust-gate:
    name: Trust gate
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.check_npm_auth != true)
    needs: [contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Require every trust stage
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
        run: test "$CONTRACTS_RESULT" = success

  publish-alpha:
    name: Publish alpha
    needs: [trust-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CONTINUOUS_ALPHA == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-alpha
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-alpha
      cancel-in-progress: false
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
      - name: Setup Node.js and pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@24.19.0
          install: false
      - name: Install Corepack and OIDC-capable npm
        run: npm install --global corepack@0.35.0 npm@11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Check published alpha inputs
        id: alpha-inputs
        run: node tooling/alpha-inputs.mjs
      - name: Prepare unique alpha version
        if: steps.alpha-inputs.outputs.changed == 'true'
        env:
          ALPHA_RUN: ${{ github.run_number }}
          ALPHA_ATTEMPT: ${{ github.run_attempt }}
        run: |
          VERSION=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; import { inc } from "semver"; const { version } = JSON.parse(readFileSync("packages/core/package.json")); console.log(`${inc(version, "patch")}-alpha.${process.env.ALPHA_RUN}.${process.env.ALPHA_ATTEMPT}`)')
          pnpm release "$VERSION"
          pnpm install --lockfile-only --no-frozen-lockfile
      - name: Build release packages
        if: steps.alpha-inputs.outputs.changed == 'true'
        run: pnpm build
      - name: Publish current main alpha
        if: steps.alpha-inputs.outputs.changed == 'true'
        env:
          PIBBL_ALPHA_INPUT_HASH: ${{ steps.alpha-inputs.outputs.hash }}
          TESTED_COMMIT: ${{ github.sha }}
        run: |
          HEAD_COMMIT=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$HEAD_COMMIT" != "$TESTED_COMMIT" ]; then
            echo "Skipping superseded commit; a newer main commit will publish after passing trust."
            exit 0
          fi
          pnpm publish:ci --alpha

  npm-auth-check:
    name: Check npm trusted publishing
    if: github.event_name == 'workflow_dispatch' && inputs.check_npm_auth == true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: npm-alpha
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup publishing runtime
        uses: pnpm/setup@v2
        with:
          runtime: node@24.19.0
          install: false
      - name: Install publishing npm
        run: npm install --global corepack@0.35.0 npm@11
      - name: Check publisher token exchange without publishing
        run: node tooling/npm-publishing-auth.mjs
      - name: Diagnose npm CLI without publishing
        continue-on-error: true
        run: |
          command -v npm
          npm --version
          pnpm exec npm --version
          pnpm exec npm publish ./packages/core --dry-run --ignore-scripts --tag auth-check --loglevel=verbose
