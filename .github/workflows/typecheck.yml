name: Type Check 📝

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout 📦
        uses: actions/checkout@v7

      - name: Setup Node.js and PNPM 🟢
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install Dependencies 🔧
        run: pnpm install --frozen-lockfile

      - name: Type Check 📝
        run: pnpm typecheck
