name: Test Suite 🧪

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests 🚀
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Prevent hung jobs

    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1 # We'll handle this in setup

    steps:
      - name: Checkout 📦
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Faster clone for tests

      - name: Setup PNPM 📦
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node.js 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Install Dependencies 🔧
        run: pnpm install --frozen-lockfile

      - name: Setup Playwright 🎭
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Tests ⚡
        id: test-run
        run: pnpm test:ci

      - name: Upload Test Screenshots 📸
        if: always() && (steps.test-run.outcome == 'failure' || steps.test-run.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ github.run_id }}
          path: |
            **/__screenshots__/**
            **/test-screenshots/**
          retention-days: 7
          if-no-files-found: error
          compression-level: 9
