name: Test Suite 🧪

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests 🚀
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Prevent hung jobs

    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1 # We'll handle this in setup

    steps:
      - name: Checkout 📦
        uses: actions/checkout@v7
        with:
          fetch-depth: 1 # Faster clone for tests

      - name: Setup Node.js and PNPM 🟢
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install Dependencies 🔧
        run: pnpm install --frozen-lockfile

      - name: Setup Playwright 🎭
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Tests ⚡
        id: test-run
        run: pnpm test:ci

      - name: Upload Test Screenshots 📸
        if: always() && (steps.test-run.outcome == 'failure' || steps.test-run.outcome == 'success')
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-${{ github.run_id }}
          path: |
            **/__screenshots__/**
            **/.vitest-attachments/**
            **/test-screenshots/**
          retention-days: 7
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
