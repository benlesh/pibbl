packages:
  - packages/*
  - packages/*/playground
  - playground
  - examples/*
  - docs
  - website
allowBuilds:
  esbuild: true
  msw: false
catalog:
  "@fontsource-variable/jetbrains-mono": ^5.3.0
  "@fontsource-variable/space-grotesk": ^5.3.0
  "@babel/core": ^8.0.1
  "@babel/eslint-parser": ^8.0.1
  "@babel/parser": ^8.0.4
  "@babel/plugin-transform-react-jsx": ^8.0.1
  "@eslint/js": ^10.0.1
  "@types/node": ^26.2.0
  "@types/three": ^0.186.0
  "@vitest/browser-playwright": ^4.1.12
  eslint: ^10.8.1
  esbuild: ^0.28.2
  globals: ^17.9.0
  lz-string: ^1.5.0
  markdown-it: ^15.0.3
  minisearch: ^7.2.0
  monaco-editor: 0.56.0
  playwright: ^1.62.1
  prettier: ^3.9.6
  rimraf: ^6.1.4
  tsx: ^4.23.12
  three: ^0.186.0
  typescript: ^7.0.2
  vite: ^8.2.6
  vitest: ^4.1.12
  yaml: ^2.9.0

overrides:
  # Monaco 0.56.0 pins a sanitizer affected by GHSA-cg2g-xh64-v4q7.
  monaco-editor@0.56.0>dompurify: 3.4.17
  # These consumers only use the retained Minimatch matching API.
  eslint@10.8.1>minimatch: 11.0.6
  "@eslint/config-array@0.23.5>minimatch": 11.0.6

patchedDependencies:
  monaco-editor@0.56.0: patches/monaco-editor@0.56.0.patch
