<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="298" height="350" viewBox="0 0 298 350" role="img" aria-labelledby="title"><title id="title">Pibbl Tangram assembly animation</title><style>@keyframes settle{from{opacity:0;transform:translate(var(--dx),var(--dy))}to{opacity:1;transform:translate(0px,0px)}}.piece{animation:settle .75s cubic-bezier(.2,.8,.2,1) both}.triangle{--dx:-24px;--dy:-30px}.square{--dx:0px;--dy:35px;animation-delay:.12s}.bowl{--dx:35px;--dy:-10px;animation-delay:.24s}@media(prefers-reduced-motion:reduce){.piece{animation:none}}</style><g transform="translate(35 35)"><g class="piece triangle"><path fill="#FEC104" d="M0 0H128L0 140Z"/></g><g class="piece square"><path fill="#FD4534" d="M0 140H124V280H0Z"/></g><g class="piece bowl"><path fill="#006CFE" d="M128 0H148C192 0 228 31 228 70C228 109 192 140 148 140H128Z"/></g></g></svg>
